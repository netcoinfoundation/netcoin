name: Build

# Compile and test on every push / pull request. Binaries built here are
# kept as workflow artifacts for a few days; official downloads are made by
# the "Release" workflow.

on:
  push:
  pull_request:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
          - name: Ubuntu 26.04
            image: ubuntu:26.04
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git build-essential pkg-config \
            libssl-dev libboost-all-dev libsqlite3-dev libdb5.3++-dev \
            libleveldb-dev libminiupnpc-dev qtbase5-dev qttools5-dev-tools libqrencode-dev
      - uses: actions/checkout@v5
      - name: Build, test and package
        run: bash contrib/ci/build-linux.sh ci-${GITHUB_SHA::8}
      - uses: actions/upload-artifact@v5
        with:
          name: netcoin-${{ matrix.image == 'ubuntu:24.04' && 'ubuntu-24.04' || 'ubuntu-26.04' }}
          path: dist/*.tar.gz
          retention-days: 7

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip
      - uses: actions/checkout@v5
      - name: Build, test and package
        run: bash contrib/ci/build-windows.sh ci-${GITHUB_SHA::8}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: netcoin-win64
          path: |
            dist/*.zip
            build-windows.log
          retention-days: 7
