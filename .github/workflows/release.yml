name: Release

# Builds the Linux and Windows binaries and publishes them as a GitHub
# Release. Runs only when the repository owner asks for it:
#   - Actions tab -> "Release" -> "Run workflow" (enter a version, e.g. v3.0.1), or
#   - pushing a tag v* (git tag v3.0.1 && git push origin v3.0.1).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version / tag name, e.g. v3.0.1"
        required: true
      prerelease:
        description: "Mark as pre-release (test build)"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  check:
    name: Only the owner may release
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner
    steps:
      - run: echo "Release ${VERSION} requested by ${{ github.actor }}"

  linux:
    needs: check
    strategy:
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04"]
    name: Linux (${{ matrix.image }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git build-essential pkg-config \
            libssl-dev libboost-all-dev libsqlite3-dev libdb5.3++-dev \
            libleveldb-dev libminiupnpc-dev qtbase5-dev qttools5-dev-tools libqrencode-dev
      - uses: actions/checkout@v4
      - run: bash contrib/ci/build-linux.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ strategy.job-index }}
          path: dist/*.tar.gz

  windows:
    needs: check
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip
      - uses: actions/checkout@v4
      - run: bash contrib/ci/build-windows.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-win64
          path: dist/*.zip

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
        run: |
          FLAGS="--target ${GITHUB_SHA}"
          [ "$PRERELEASE" = "true" ] && FLAGS="$FLAGS --prerelease"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" assets/* --clobber
          else
            gh release create "$VERSION" assets/* $FLAGS --title "NetCoin $VERSION" \
              --notes "Binaries for Windows 10/11 (64-bit) and Ubuntu 24.04 / 26.04 (x86_64). Check the files against SHA256SUMS.txt."
          fi
